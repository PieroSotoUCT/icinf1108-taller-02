services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:${DB_PORT:?Define DB_PORT en .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taller_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:?Define ADMINER_PORT en .env}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taller_network

volumes:
  postgres_data:

networks:
  taller_network:
